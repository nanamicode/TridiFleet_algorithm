[project]
name = "tridifleet-algorithm"
version = "0.1.0"
description = "Contextual retention intelligence engine for TridiFleet"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "numpy>=2.0,<3",
  "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["tridifleet*"]
exclude = ["web*", "tests*", "scripts*"]
